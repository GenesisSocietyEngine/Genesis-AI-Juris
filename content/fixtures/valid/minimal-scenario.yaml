schema_version: "1.0"

metadata:
  id: minimal-scenario
  title: Minimal Scenario
  summary: Minimal deterministic scenario used to verify schema round-tripping.
  content_version: "1.0.0"
  author: GENESIS
  tags:
    - test
    - minimal

jurisdiction:
  code: BE-COMMERCIAL
  pack_version: test-1

initial_stage: intake

actors: []
facts: []
evidence: []

stages:
  - id: intake
    title: Intake
    kind: standard
    entry_event: null
    exit_actions:
      - close-matter
    terminal: false

  - id: resolved
    title: Resolved
    kind: resolved
    entry_event: matter-closed
    exit_actions: []
    terminal: true

actions:
  - id: close-matter
    title: Close the matter
    description: Completes the minimal scenario.
    available_when:
      type: stage_is
      stage: intake
    effects:
      - type: set_stage
        stage: resolved
      - type: trigger_event
        event: matter-closed
    time_cost_minutes: 5
    repeatability:
      type: once

deadlines: []
async_tasks: []
inbox_items: []

events:
  - id: matter-closed
    title: Matter closed
    kind: matter_closed
    trigger:
      type: by_effect
    condition:
      type: stage_is
      stage: resolved
    effects:
      - type: resolve_outcome
        outcome: successful-closure

outcomes:
  - id: successful-closure
    title: Successful closure
    summary: The minimal matter was closed successfully.
    terminal_stage: resolved
    condition:
      type: stage_is
      stage: resolved