[workspace]
members = [
    "crates/juris-core",
    "crates/juris-domain",
    "crates/juris-content",
    "crates/juris-ai",
    "crates/juris-engine",
    "crates/juris-cli", "crates/juris-scenario-schema", "crates/juris-scenario-validator",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Proprietary"
authors = ["GENESIS Project"]
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
