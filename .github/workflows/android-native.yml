name: Android Native FFI

on:
  push:
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/juris-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked-out source
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true

      - name: Resolve locked Flutter dependencies
        run: |
          test "$(dart --version 2>&1 | sed -E 's/^Dart SDK version: ([0-9.]+).*/\1/')" = "3.12.2"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Build Flutter and authoritative Rust for Android arm64
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify packaged Rust bridge
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F "lib/arm64-v8a/libjuris_mobile_ffi.so"
