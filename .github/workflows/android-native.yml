name: Android Native FFI

on:
  push:
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/juris-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build Flutter and authoritative Rust for Android arm64
        run: flutter build apk --debug --target-platform android-arm64

      - name: Verify packaged Rust bridge
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F "lib/arm64-v8a/libjuris_mobile_ffi.so"
