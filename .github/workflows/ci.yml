name: Rust CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked-out source
        run: echo "sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record checked-out source
        run: echo "sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})"
      - name: Install documented minimum Rust version
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.78.0
      - name: Check workspace on MSRV
        run: cargo +1.78.0 check --workspace --locked
      - name: Check tax WebAssembly on MSRV
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.78.0
          cargo +1.78.0 check -p juris-tax-wasm --target wasm32-unknown-unknown --locked

  tax-wasm-reproducibility:
    # Rust panic location strings retain host path separators. Pin generation;
    # Linux web builds verify and consume these same assets without Rust.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; Node 24
        with:
          node-version-file: .node-version
      - name: Install the exact generator outside production dependencies
        shell: bash
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked --bin wasm-bindgen --root .artifacts/wasm-bindgen
      - name: Rebuild and compare generated assets and complete native corpus
        shell: bash
        env:
          WASM_BINDGEN: .artifacts/wasm-bindgen/bin/wasm-bindgen.exe
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci-logs
          echo "sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})" | tee .artifacts/ci-logs/tax-source.log
          node scripts/tax-wasm-assets.mjs --rebuild-check 2>&1 | tee .artifacts/ci-logs/tax-rebuild.log
      - name: Retain generation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; Node 24
        with:
          name: tax-runtime-regeneration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-logs
            .artifacts/tax-runtime/generated-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
