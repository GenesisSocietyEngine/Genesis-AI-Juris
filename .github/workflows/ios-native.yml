name: iOS Native FFI

on:
  push:
  pull_request:

jobs:
  simulator-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/juris-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build Runner and Rust static library for iOS Simulator
        run: flutter build ios --simulator --debug --no-codesign

      - name: Verify exact native static-library exports per Mach-O slice (fail closed)
        shell: bash
        run: |
          set -euo pipefail

          archive="ios/Generated/libjuris_mobile_ffi.a"
          test -f "$archive"

          host="$(rustc +stable -vV | sed -n 's/^host: //p')"
          sysroot="$(rustc +stable --print sysroot)"
          llvm_nm="$sysroot/lib/rustlib/$host/bin/llvm-nm"
          lipo="$(xcrun --find lipo)"
          clang="$(xcrun --sdk macosx --find clang)"
          libtool="$(xcrun --sdk macosx --find libtool)"

          test -n "$host"
          test -n "$sysroot"
          test -x "$llvm_nm"
          test -x "$lipo"
          test -x "$clang"
          test -x "$libtool"

          rustc_version="$(rustc +stable -vV)"
          llvm_nm_version="$("$llvm_nm" --version)"
          llvm_nm_help="$("$llvm_nm" --help)"
          printf '%s\n' "$rustc_version"
          printf '%s\n' "$llvm_nm_version"

          echo "Xcode developer directory: $(xcode-select -p)"
          xcodebuild -version
          echo "architecture inspector: $lipo"
          echo "fixture compiler: $clang"
          echo "fixture archive tool: $libtool"

          if ! grep -Eq -- '(^|[[:space:]])--arch=' <<<"$llvm_nm_help"; then
            echo "llvm-nm does not advertise the required --arch= selector" >&2
            exit 1
          fi
          echo "llvm-nm explicit Mach-O architecture selector: supported"

          rust_llvm_version="$(
            printf '%s\n' "$rustc_version" \
              | sed -nE \
                's/^[[:space:]]*LLVM version:[[:space:]]*([0-9]+([.][0-9]+)*)[[:space:]]*$/\1/p'
          )"
          llvm_nm_llvm_version="$(
            printf '%s\n' "$llvm_nm_version" \
              | sed -nE \
                's/^[[:space:]]*LLVM version[[:space:]]+([^[:space:]]+)[[:space:]]*$/\1/p'
          )"

          if ! [[ "$rust_llvm_version" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Cannot parse exactly one Rust LLVM version" >&2
            exit 1
          fi
          if [[ "$llvm_nm_llvm_version" =~ ^([0-9]+)([.][0-9]+)*([-+~][[:alnum:]._-]+)?$ ]]; then
            llvm_nm_llvm_major="${BASH_REMATCH[1]}"
          else
            echo "Cannot parse exactly one llvm-nm LLVM version" >&2
            exit 1
          fi

          rust_llvm_major="${rust_llvm_version%%.*}"
          if [[ "$rust_llvm_major" != "$llvm_nm_llvm_major" ]]; then
            echo \
              "LLVM major mismatch: rustc=$rust_llvm_major llvm-nm=$llvm_nm_llvm_major" \
              >&2
            exit 1
          fi

          echo "Rust LLVM version: $rust_llvm_version"
          echo "llvm-nm LLVM version: $llvm_nm_llvm_version"
          echo "matched LLVM major: $rust_llvm_major"

          bash \
            "$GITHUB_WORKSPACE/.github/scripts/test_verify_ios_ffi_exports.sh" \
            "$llvm_nm" \
            "$lipo" \
            "$clang" \
            "$libtool"
          bash \
            "$GITHUB_WORKSPACE/.github/scripts/verify_ios_ffi_exports.sh" \
            "$archive" \
            "$llvm_nm" \
            "$lipo"

      - name: Boot an available iPhone Simulator
        id: simulator
        run: |
          simulator_id="$(
            xcrun simctl list devices available \
              | grep -m 1 'iPhone' \
              | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/'
          )"
          test -n "$simulator_id"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run native Logistics lifecycle on iOS Simulator
        timeout-minutes: 15
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination \
              "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:RunnerTests/RunnerTests/testNativeLogisticsLifecycle \
            CODE_SIGNING_ALLOWED=NO
