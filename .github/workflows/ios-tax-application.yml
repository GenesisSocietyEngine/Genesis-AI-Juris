name: iOS Tax Application

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-tax-application-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-process-restart:
    runs-on: macos-15-intel
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/juris-mobile
    env:
      IOS_TAX_EVIDENCE_DIR: ${{ runner.temp }}/ios-tax-application-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - name: Resolve locked Flutter dependencies
        run: |
          test "$(dart --version 2>&1 | sed -E 's/^Dart SDK version: ([0-9.]+).*/\1/')" = "3.12.2"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Create a fresh isolated iPhone Simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IOS_TAX_EVIDENCE_DIR"
          xcrun simctl list --json > "$IOS_TAX_EVIDENCE_DIR/simulator-inventory.json"
          read -r device_type runtime < <(python3 - "$IOS_TAX_EVIDENCE_DIR/simulator-inventory.json" <<'PY'
          import json, sys
          inventory = json.load(open(sys.argv[1]))
          types = {entry['name']: entry['identifier'] for entry in inventory['devicetypes']}
          for runtime, devices in inventory['devices'].items():
              for device in devices:
                  if device.get('isAvailable') and device['name'].startswith('iPhone') and device['name'] in types:
                      print(types[device['name']], runtime)
                      sys.exit(0)
          raise SystemExit('No supported iPhone simulator/runtime pair found')
          PY
          )
          test -n "$device_type"
          test -n "$runtime"
          simulator_id="$(xcrun simctl create "Juris Tax Acceptance $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$device_type" "$runtime")"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Exercise the actual editor across application termination and relaunch
        timeout-minutes: 30
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/run_ios_tax_application.sh" \
            "${{ steps.simulator.outputs.id }}" "$IOS_TAX_EVIDENCE_DIR"
      - name: Retain application inputs, native exchanges, screenshots and process evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-tax-application-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IOS_TAX_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14
      - name: Shut down this workflow's isolated simulator
        if: ${{ always() && steps.simulator.outputs.id != '' }}
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.id }}"
