name: Calendar reminder delivery
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Check the queue without delivering any email
        type: boolean
        default: true
permissions: {}
concurrency:
  group: calendar-reminder-delivery
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && inputs.check_only
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      id-token: write
    steps:
      - name: Process due reminders
        env:
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const endpoint="https://casevant.pro/api/calendar/dispatch";
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set("audience",endpoint);
          const assertion=await fetch(url,{headers:{Authorization:"Bearer "+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},redirect:"error"});
          if(!assertion.ok)throw Error("Scheduler identity unavailable: "+assertion.status);
          const {value}=await assertion.json();
          const [h,p,sig]=value.split(".");
          const data=JSON.parse(Buffer.from(p,"base64url")),head=JSON.parse(Buffer.from(h,"base64url"));
          const repo=process.env.GITHUB_REPOSITORY,tag=process.env.GITHUB_REF,now=Date.now()/1000;
          const keysResponse=await fetch("https://token.actions.githubusercontent.com/.well-known/jwks");
          const jwks=await keysResponse.json(),k=jwks.keys.find(v=>v.kid===head.kid);
          const key=k&&await crypto.subtle.importKey("jwk",k,{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["verify"]);
          console.log(JSON.stringify({alg:head.alg,knownKey:!!key,signature:key&&await crypto.subtle.verify("RSASSA-PKCS1-v1_5",key,Buffer.from(sig,"base64url"),Buffer.from(h+"."+p)),issuer:data.iss==="https://token.actions.githubusercontent.com",aud:data.aud===endpoint,repository:data.repository===repo,repoId:String(data.repository_id)==="1311507341",ownerId:String(data.repository_owner_id)==="308170479",ref:data.ref===tag,workflow:data.workflow_ref===repo+"/.github/workflows/calendar-delivery.yml@"+tag,event:data.event_name,validNow:data.exp>now&&data.nbf<=now+30,lifetime:data.exp-data.nbf,issueOffset:data.iat-data.nbf,tokenChars:value.length}));
          for(const base of [endpoint,"https://genesis-juris-web.maxim-hayan.chatgpt.site/api/calendar/dispatch"]){const r=await fetch(base+"?check=1",{method:"POST",headers:{Authorization:"Bearer "+value},redirect:"manual"}); console.log("Check-only rejection on diagnostic branch:",r.status,r.headers.get("Content-Type"),(await r.arrayBuffer()).byteLength);}
          JS
