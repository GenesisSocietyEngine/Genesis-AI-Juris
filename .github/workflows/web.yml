name: Root Web and PDF

on:
  push:
  pull_request:

jobs:
  web-and-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out source
        run: |
          echo "sha=$(git rev-parse HEAD)"
          echo "tree=$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Pin npm
        run: |
          npm install --global npm@10.9.8
          test "$(node --version)" = "v22.23.2"
          test "$(npm --version)" = "10.9.8"
      - name: Install Poppler PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          pdfinfo -v
          pdftotext -v
          pdftoppm -v
      - name: Install exact web dependencies
        run: |
          lock_sha="$(sha256sum package-lock.json)"
          npm run install:ci
          test "$(sha256sum package-lock.json)" = "$lock_sha"
          git diff --exit-code -- package-lock.json
      - name: Strict typecheck
        run: npm run typecheck
      - name: Verify root-web/mobile contract lock
        run: npm run parity:lock
      - name: Lint
        run: npm run lint
      - name: Complete web tests and build
        run: npm test
      - name: Verify report PDFs with Poppler
        run: npm run reports:verify -- .artifacts/ci-report-pdf
      - name: Audit complete dependency tree
        run: npm audit --audit-level=low
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=low
      - name: Upload PDF evidence or failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-report-pdf
            .artifacts/**/*.log
          if-no-files-found: warn
          retention-days: 14
