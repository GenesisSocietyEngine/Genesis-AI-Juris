name: Flutter Mobile UI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/juris-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify generated mobile bundle and authoritative fingerprints
        run: dart run tool/export_mobile_case_bundle.dart --repo-root ../.. --check
      - name: Analyze mobile shell
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
