name: Flutter Mobile UI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/juris-mobile
    steps:
      - uses: actions/checkout@v4
      - name: Record checked-out source
        working-directory: ${{ github.workspace }}
        run: echo "sha=$(git rev-parse HEAD) tree=$(git rev-parse HEAD^{tree})"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - name: Verify pinned SDKs and resolve locked Flutter dependencies
        run: |
          test "$(dart --version 2>&1 | sed -E 's/^Dart SDK version: ([0-9.]+).*/\1/')" = "3.12.2"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Check Dart formatting without writes
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Verify generated mobile bundle and authoritative fingerprints
        run: dart run tool/export_mobile_case_bundle.dart --repo-root ../.. --check
      - name: Analyze mobile shell
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
