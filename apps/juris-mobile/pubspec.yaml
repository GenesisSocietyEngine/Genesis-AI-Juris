name: juris_mobile
description: "Smartphone-first UI shell for GENESIS: AI Juris."
publish_to: "none"
version: 0.8.0+15

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  path_provider: ^2.1.6

dev_dependencies:
  crypto: ^3.0.7
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/genesis_ai_juris_logo.png
    - assets/case_catalog/
    - assets/case_types/
    - assets/visual_identity/
  fonts:
    - family: JurisLiterata
      fonts:
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    - family: JurisPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: JurisPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
